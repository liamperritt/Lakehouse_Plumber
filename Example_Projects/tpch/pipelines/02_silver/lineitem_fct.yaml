pipeline: tpch_pipeline
flowgroup: lineitem_fct
presets:
  - tpch_delta_properties
actions:
  - name: load_lineitem_bronze
    type: load
    readMode: stream
    source:
      type: delta
      catalog: "${catalog}"
      schema: "${bronze_schema}"
      table: lineitem
    target: v_lineitem_bronze
    description: "Stream the bronze lineitem table"

  - name: build_lineitem_fct
    type: transform
    transform_type: sql
    source: v_lineitem_bronze
    target: v_lineitem_fct
    sql: |
      SELECT
        CAST(l_orderkey AS BIGINT)            AS order_id,
        CAST(l_partkey AS BIGINT)             AS part_id,
        CAST(l_suppkey AS BIGINT)             AS supplier_id,
        CAST(l_linenumber AS INT)             AS line_number,
        CAST(l_quantity AS DECIMAL(18,2))     AS quantity,
        CAST(l_extendedprice AS DECIMAL(18,2)) AS extended_price,
        CAST(l_discount AS DECIMAL(18,2))     AS discount,
        CAST(l_extendedprice * (1 - l_discount) AS DECIMAL(18,2)) AS net_amount,
        CAST(l_shipdate AS DATE)              AS ship_date
      FROM stream(v_lineitem_bronze)

  - name: write_lineitem_fct
    type: write
    source: v_lineitem_fct
    write_target:
      type: streaming_table
      catalog: "${catalog}"
      schema: "${silver_schema}"
      table: lineitem_fct
      table_schema: schemas/silver/lineitem_fct.yaml
      comment: "Line item fact with derived net amount"
      tags:
        lhp_data_layer: silver
        lhp_domain: sales
        lhp_data_product: tpch
        lhp_owner: data-engineering
        lhp_sensitivity: internal
        lhp_certified: "true"
        lhp_sla: "daily"
