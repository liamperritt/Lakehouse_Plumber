pipeline: tpch_pipeline
flowgroup: part_dim
presets:
  - tpch_delta_properties
actions:
  - name: load_part_bronze
    type: load
    readMode: stream
    source:
      type: delta
      catalog: "${catalog}"
      schema: "${bronze_schema}"
      table: part
    target: v_part_bronze
    description: "Stream the bronze part table"

  - name: cleanse_part
    type: transform
    transform_type: sql
    source: v_part_bronze
    target: v_part_dim
    sql: |
      SELECT
        CAST(p_partkey AS BIGINT)          AS part_id,
        p_name                             AS name,
        p_mfgr                             AS manufacturer,
        p_brand                            AS brand,
        p_type                             AS type,
        CAST(p_size AS INT)                AS size,
        CAST(p_retailprice AS DECIMAL(18,2)) AS retail_price
      FROM stream(v_part_bronze)

  - name: write_part_dim
    type: write
    source: v_part_dim
    write_target:
      type: streaming_table
      catalog: "${catalog}"
      schema: "${silver_schema}"
      table: part_dim
      table_schema: schemas/silver/part_dim.yaml
      comment: "Conformed part dimension"
      tags:
        lhp_data_layer: silver
        lhp_domain: supply_chain
        lhp_data_product: tpch
        lhp_owner: data-engineering
        lhp_sensitivity: internal
        lhp_certified: "true"
        lhp_sla: "daily"
