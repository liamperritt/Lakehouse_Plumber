pipeline: tpch_pipeline
flowgroup: supplier_bronze
presets:
  - tpch_delta_properties
actions:
  - name: load_supplier
    type: load
    readMode: stream
    source:
      type: delta
      catalog: samples
      schema: tpch
      table: supplier
    target: v_supplier_src
    description: "Stream samples.tpch.supplier"

  - name: write_supplier_bronze
    type: write
    source: v_supplier_src
    write_target:
      type: streaming_table
      catalog: "${catalog}"
      schema: "${bronze_schema}"
      table: supplier
      table_schema: schemas/bronze/supplier.yaml
      comment: "TPC-H supplier (bronze)"
      tags:
        lhp_data_layer: bronze
        lhp_domain: supply_chain
        lhp_source_system: tpch_samples
        lhp_data_product: tpch
        lhp_owner: data-engineering
        lhp_cost_center: "CC-2071"
        lhp_sensitivity: confidential
        lhp_contains_pii: ""
        lhp_certified: ""
