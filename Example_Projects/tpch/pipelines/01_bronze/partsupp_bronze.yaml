pipeline: tpch_pipeline
flowgroup: partsupp_bronze
presets:
  - tpch_delta_properties
actions:
  - name: load_partsupp
    type: load
    readMode: stream
    source:
      type: delta
      catalog: samples
      schema: tpch
      table: partsupp
    target: v_partsupp_src
    description: "Stream samples.tpch.partsupp"

  - name: write_partsupp_bronze
    type: write
    source: v_partsupp_src
    write_target:
      type: streaming_table
      catalog: "${catalog}"
      schema: "${bronze_schema}"
      table: partsupp
      table_schema: schemas/bronze/partsupp.yaml
      comment: "TPC-H partsupp (bronze)"
      tags:
        lhp_data_layer: bronze
        lhp_domain: supply_chain
        lhp_source_system: tpch_samples
        lhp_data_product: tpch
        lhp_owner: data-engineering
        lhp_cost_center: "CC-2071"
        lhp_sensitivity: internal
        lhp_certified: ""
