name: supplier_dim
version: "1.0"
description: "Conformed supplier dimension (silver)"

columns:
  - name: supplier_id
    type: BIGINT
    nullable: false
    comment: "Supplier business key"
    tags:
      lhp_classification: identifier
      lhp_semantic_type: supplier_id
  - name: name
    type: STRING
    nullable: true
    comment: "Supplier name"
    tags:
      lhp_classification: confidential
      lhp_semantic_type: company_name
  - name: address
    type: STRING
    nullable: true
    comment: "Supplier address"
    tags:
      lhp_classification: confidential
      lhp_semantic_type: postal_address
      lhp_masking_policy: mask_full
  - name: nation_id
    type: BIGINT
    nullable: false
    comment: "Nation foreign key"
    tags:
      lhp_classification: reference
      lhp_semantic_type: foreign_key
  - name: phone
    type: STRING
    nullable: true
    comment: "Phone number"
    tags:
      lhp_classification: pii
      lhp_semantic_type: phone_number
      lhp_masking_policy: mask_partial
      lhp_contains_pii: ""
  - name: account_balance
    type: DECIMAL(18,2)
    nullable: true
    comment: "Account balance"
    tags:
      lhp_classification: financial
      lhp_semantic_type: money

primary_key: [supplier_id]
